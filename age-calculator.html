<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Age Calculator - TinyForge</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', 'DM Sans', Arial, sans-serif;
    background-color: #101211; color: #F8F8F5;
    min-height: 100vh; margin: 0; display: flex; flex-direction: column;
  }
  .app-header {
    background-color: #171918; padding: 15px 20px;
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 100;
    border-bottom: 1px solid #2E3330; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
  }
  .header-title { font-size: 20px; font-weight: 700; color: #F8F8F5; }
  .back-btn {
    color: #FFFFFF; text-decoration: none; padding: 8px 15px; border-radius: 6px;
    background-color: #F15A24; font-size: 14px; font-weight: 600;
    box-shadow: 0 4px 12px rgba(241,90,36,0.20);
    transition: background-color 200ms cubic-bezier(0.16,1,0.3,1), transform 200ms cubic-bezier(0.16,1,0.3,1), box-shadow 200ms cubic-bezier(0.16,1,0.3,1);
  }
  .back-btn:hover { background-color: #D94818; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(241,90,36,0.35); }
  .back-btn:active { transform: scale(0.96); transition-duration: 80ms; }
  .main-content { flex-grow: 1; display: flex; justify-content: center; align-items: flex-start; padding: 50px 20px; width: 100%; }
  .container {
    padding: 25px; border-radius: 14px; max-width: 440px; width: 100%;
    background: #222624; border: 1px solid #2E3330;
    box-shadow: 0 8px 24px rgba(20,25,22,0.08); text-align: center;
  }
  h1 { font-size: 22px; margin: 0 0 6px; color: #F8F8F5; }
  .sub { font-size: 13px; color: #B8BBB5; margin-bottom: 18px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #F8F8F5; margin: 12px 0 6px; text-align: left; }
  input[type="date"] {
    width: 100%; padding: 12px; font-size: 15px;
    border: 1px solid #2E3330; border-radius: 8px;
    background: #101211; color: #F8F8F5; outline: none;
  }
  input[type="date"]:focus { border-color: #F15A24; box-shadow: 0 0 0 3px rgba(241,90,36,0.15); }
  button {
    background: #F15A24; color: #FFFFFF; border: none; border-radius: 6px;
    min-height: 44px; padding: 12px 16px; font-size: 14px; line-height: 1; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    margin-top: 14px; width: 100%;
    box-shadow: 0 4px 12px rgba(241,90,36,0.20);
    transition: background-color 200ms cubic-bezier(0.16,1,0.3,1), transform 200ms cubic-bezier(0.16,1,0.3,1), box-shadow 200ms cubic-bezier(0.16,1,0.3,1);
  }
  button:hover { background: #D94818; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(241,90,36,0.35); }
  button:active { transform: scale(0.96); transition-duration: 80ms; box-shadow: none; }
  .result {
    margin-top: 18px; padding: 16px; border-radius: 8px;
    background: #101211; border: 1px solid #2E3330; display: none;
  }
  .result.show { display: block; }
  .big { font-size: 20px; font-weight: 700; color: #F8F8F5; margin-bottom: 8px; }
  .big span { color: #F15A24; }
  .detail { font-size: 13px; color: #B8BBB5; line-height: 1.8; }
  .good { color: #789447; font-weight: 600; }
  footer { background: #171918; border-top: 1px solid #2E3330; color: #B8BBB5; text-align: center; padding: 12px 20px; font-size: 12px; }
</style>
</head>
<body>
<header class="app-header">
  <div class="header-title">Age Calculator</div>
  <a href="mywebpro.html" class="back-btn">Back</a>
</header>
<div class="main-content">
  <div class="container">
    <h1>Age Calculator</h1>
    <p class="sub">Enter DOB to get exact age instantly. Ideal for HR and form work.</p>
    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob" max="" />
    <button onclick="calcAge()">Calculate Age</button>
    <div class="result" id="result">
      <div class="big" id="bigAge"></div>
      <div class="detail" id="detail"></div>
    </div>
  </div>
</div>
<footer>&copy; 2025 TinyForge. All rights reserved.</footer>
<script>
  document.getElementById('dob').max = new Date().toISOString().split('T')[0];
  function calcAge() {
    const dobVal = document.getElementById('dob').value;
    if (!dobVal) { alert('Please select date of birth.'); return; }
    const dob = new Date(dobVal);
    const today = new Date();
    if (dob > today) { alert('DOB cannot be in the future.'); return; }
    let years = today.getFullYear() - dob.getFullYear();
    let months = today.getMonth() - dob.getMonth();
    let days = today.getDate() - dob.getDate();
    if (days < 0) {
      months--;
      const prevMonth = new Date(today.getFullYear(), today.getMonth(), 0).getDate();
      days += prevMonth;
    }
    if (months < 0) { years--; months += 12; }
    const totalMonths = years * 12 + months;
    const totalDays = Math.floor((today - dob) / (1000 * 60 * 60 * 24));
    const dayName = dob.toLocaleDateString('en-US', { weekday: 'long' });
    document.getElementById('bigAge').innerHTML = years + ' <span>years</span> ' + months + ' <span>months</span> ' + days + ' <span>days</span>';
    document.getElementById('detail').innerHTML =
      'Born on: ' + dayName + '<br>' +
      'Total months: ' + totalMonths + '<br>' +
      'Total days: ' + totalDays.toLocaleString('en-IN') + '<br>' +
      '<span class="good">Turning ' + (years + 1) + ' on next birthday</span>';
    document.getElementById('result').classList.add('show');
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Text Case Converter - TinyForge</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', 'DM Sans', Arial, sans-serif;
    background-color: #101211;
    color: #F8F8F5;
    min-height: 100vh;
    margin: 0;
    display: flex;
    flex-direction: column;
  }
  .app-header {
    background-color: #171918;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid #2E3330;
    box-shadow: 0 2px 5px rgba(0,0,0,0.5);
  }
  .header-title { font-size: 20px; font-weight: 700; color: #F8F8F5; }
  .back-btn {
    color: #FFFFFF; text-decoration: none; padding: 8px 15px; border-radius: 6px;
    background-color: #F15A24; font-size: 14px; font-weight: 600;
    box-shadow: 0 4px 12px rgba(241,90,36,0.20);
    transition: background-color 200ms cubic-bezier(0.16,1,0.3,1), transform 200ms cubic-bezier(0.16,1,0.3,1), box-shadow 200ms cubic-bezier(0.16,1,0.3,1);
  }
  .back-btn:hover { background-color: #D94818; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(241,90,36,0.35); }
  .back-btn:active { transform: scale(0.96); transition-duration: 80ms; }
  .main-content { flex-grow: 1; display: flex; justify-content: center; align-items: flex-start; padding: 50px 20px; width: 100%; }
  .container {
    padding: 25px; border-radius: 14px; max-width: 640px; width: 100%;
    background: #222624; border: 1px solid #2E3330;
    box-shadow: 0 8px 24px rgba(20,25,22,0.08);
  }
  h1 { font-size: 22px; margin: 0 0 6px; color: #F8F8F5; text-align: center; }
  .sub { text-align: center; font-size: 13px; color: #B8BBB5; margin-bottom: 18px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #F8F8F5; margin: 12px 0 6px; }
  textarea {
    width: 100%; min-height: 140px; padding: 12px; font-size: 14px;
    border: 1px solid #2E3330; border-radius: 8px;
    background: #101211; color: #F8F8F5; outline: none; resize: vertical;
  }
  textarea:focus { border-color: #F15A24; box-shadow: 0 0 0 3px rgba(241,90,36,0.15); }
  .btn-row { display: flex; gap: 8px; margin-top: 14px; align-items: stretch; }
  button {
    flex: 1; white-space: nowrap;
    background: #F15A24; color: #FFFFFF; border: none; border-radius: 6px;
    min-height: 44px; padding: 12px 8px; font-size: 14px; line-height: 1; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(241,90,36,0.20);
    transition: background-color 200ms cubic-bezier(0.16,1,0.3,1), transform 200ms cubic-bezier(0.16,1,0.3,1), box-shadow 200ms cubic-bezier(0.16,1,0.3,1);
  }
  button:hover { background: #D94818; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(241,90,36,0.35); }
  button:active { transform: scale(0.96); transition-duration: 80ms; box-shadow: none; }
  button.ghost { background: #101211; color: #F8F8F5; border: 1px solid #2E3330; box-shadow: none; }
  button.ghost:hover { background: #2E3330; }
  .stats { margin-top: 12px; font-size: 13px; color: #B8BBB5; text-align: center; }
  footer { background: #171918; border-top: 1px solid #2E3330; color: #B8BBB5; text-align: center; padding: 12px 20px; font-size: 12px; }
</style>
</head>
<body>
<header class="app-header">
  <div class="header-title">Text Case Converter</div>
  <a href="mywebpro.html" class="back-btn">Back</a>
</header>
<div class="main-content">
  <div class="container">
    <h1>Text Case Converter</h1>
    <p class="sub">Clean data fast - UPPER, lower, Proper Case in one click.</p>
    <label for="input">Your Text:</label>
    <textarea id="input" placeholder="Paste your text here..."></textarea>
    <div class="btn-row">
      <button onclick="toUpper()">UPPER CASE</button>
      <button onclick="toLower()">lower case</button>
      <button onclick="toProper()">Proper Case</button>
      <button onclick="toSentence()">Sentence case</button>
      <button class="ghost" onclick="copyText()">Copy</button>
      <button class="ghost" onclick="clearText()">Clear</button>
    </div>
    <div class="stats" id="stats">Characters: 0 | Words: 0 | Lines: 0</div>
  </div>
</div>
<footer>&copy; 2025 TinyForge. All rights reserved.</footer>
<script>
  const input = document.getElementById('input');
  const stats = document.getElementById('stats');
  function updateStats() {
    const t = input.value;
    const chars = t.length;
    const words = t.trim() === '' ? 0 : t.trim().split(/\s+/).length;
    const lines = t === '' ? 0 : t.split('\n').length;
    stats.textContent = 'Characters: ' + chars + ' | Words: ' + words + ' | Lines: ' + lines;
  }
  input.addEventListener('input', updateStats);
  function toUpper() { input.value = input.value.toUpperCase(); updateStats(); }
  function toLower() { input.value = input.value.toLowerCase(); updateStats(); }
  function toProper() {
    input.value = input.value.toLowerCase().replace(/\b\w/g, function(c) { return c.toUpperCase(); });
    updateStats();
  }
  function toSentence() {
    const lower = input.value.toLowerCase();
    input.value = lower.replace(/(^\s*\w|[.!?]\s*\w)/g, function(c) { return c.toUpperCase(); });
    updateStats();
  }
  function copyText() {
    if (!input.value) return;
    navigator.clipboard.writeText(input.value).catch(function() {
      input.select();
      document.execCommand('copy');
    });
  }
  function clearText() { input.value = ''; updateStats(); }
  updateStats();
</script>
</body>
</html>

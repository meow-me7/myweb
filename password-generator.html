<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Password Generator - TinyForge</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', 'DM Sans', Arial, sans-serif;
    background-color: #101211; color: #F8F8F5;
    min-height: 100vh; margin: 0; display: flex; flex-direction: column;
  }
  .app-header {
    background-color: #171918; padding: 15px 20px;
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 100;
    border-bottom: 1px solid #2E3330; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
  }
  .header-title { font-size: 20px; font-weight: 700; color: #F8F8F5; }
  .back-btn {
    color: #FFFFFF; text-decoration: none; padding: 8px 15px; border-radius: 6px;
    background-color: #F15A24; font-size: 14px; font-weight: 600;
    box-shadow: 0 4px 12px rgba(241,90,36,0.20);
    transition: background-color 200ms cubic-bezier(0.16,1,0.3,1), transform 200ms cubic-bezier(0.16,1,0.3,1), box-shadow 200ms cubic-bezier(0.16,1,0.3,1);
  }
  .back-btn:hover { background-color: #D94818; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(241,90,36,0.35); }
  .back-btn:active { transform: scale(0.96); transition-duration: 80ms; }
  .main-content { flex-grow: 1; display: flex; justify-content: center; align-items: flex-start; padding: 50px 20px; width: 100%; }
  .container {
    padding: 25px; border-radius: 14px; max-width: 440px; width: 100%;
    background: #222624; border: 1px solid #2E3330;
    box-shadow: 0 8px 24px rgba(20,25,22,0.08);
  }
  h1 { font-size: 22px; margin: 0 0 6px; color: #F8F8F5; text-align: center; }
  .sub { font-size: 13px; color: #B8BBB5; margin-bottom: 18px; text-align: center; }
  .output {
    background: #101211; border: 1px solid #2E3330; border-radius: 8px;
    padding: 14px; font-size: 16px; font-weight: 600; letter-spacing: 1px;
    word-break: break-all; min-height: 52px; text-align: center; color: #F8F8F5;
  }
  .strength { text-align: center; font-size: 13px; margin-top: 8px; color: #B8BBB5; }
  .strength b { color: #789447; }
  .bar { display: flex; gap: 6px; margin-top: 10px; }
  .bar span { flex: 1; height: 6px; border-radius: 6px; background: #2E3330; transition: background-color 250ms cubic-bezier(0.16,1,0.3,1); }
  .bar span.on1 { background: #EF4444; }
  .bar span.on2 { background: #F15A24; }
  .bar span.on3 { background: #EAB308; }
  .bar span.on4 { background: #789447; }
  .meta { font-size: 12px; color: #B8BBB5; text-align: center; margin-top: 8px; line-height: 1.7; }
  .meta b { color: #F8F8F5; }
  label.row { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #F8F8F5; margin: 12px 0; cursor: pointer; }
  input[type="checkbox"] { width: 18px; height: 18px; accent-color: #F15A24; }
  input[type="number"] {
    width: 100%; padding: 10px; font-size: 15px;
    border: 1px solid #2E3330; border-radius: 8px;
    background: #101211; color: #F8F8F5; outline: none;
  }
  input[type="number"]:focus { border-color: #F15A24; box-shadow: 0 0 0 3px rgba(241,90,36,0.15); }
  .btn-row { display: flex; gap: 8px; margin-top: 14px; align-items: stretch; }
  button {
    flex: 1; background: #F15A24; color: #FFFFFF; border: none; border-radius: 6px;
    min-height: 44px; padding: 12px 16px; font-size: 14px; line-height: 1; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(241,90,36,0.20);
    transition: background-color 200ms cubic-bezier(0.16,1,0.3,1), transform 200ms cubic-bezier(0.16,1,0.3,1), box-shadow 200ms cubic-bezier(0.16,1,0.3,1);
  }
  button:hover { background: #D94818; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(241,90,36,0.35); }
  button:active { transform: scale(0.96); transition-duration: 80ms; box-shadow: none; }
  button.ghost { background: #101211; color: #F8F8F5; border: 1px solid #2E3330; box-shadow: none; flex: 0.6; }
  button.ghost:hover { background: #2E3330; transform: translateY(-2px); box-shadow: none; }
  @media (prefers-reduced-motion: reduce) {
    button, .back-btn, .bar span { transition-duration: 150ms !important; transform: none !important; }
  }
  footer { background: #171918; border-top: 1px solid #2E3330; color: #B8BBB5; text-align: center; padding: 12px 20px; font-size: 12px; }
</style>
</head>
<body>
<header class="app-header">
  <div class="header-title">Password Generator</div>
  <a href="mywebpro.html" class="back-btn">Back</a>
</header>
<div class="main-content">
  <div class="container">
    <h1>Password Generator</h1>
    <p class="sub">Strong and safe password in one click. 100% offline.</p>
    <div class="output" id="out">Click Generate</div>
    <div class="strength" id="strength"></div>
    <div class="bar" id="bar"><span></span><span></span><span></span><span></span></div>
    <div class="meta" id="meta"></div>
    <label class="row" style="margin-top:16px;">Length (4 - 50):</label>
    <input type="range" id="lenRange" min="4" max="50" value="12" style="width:100%; accent-color:#F15A24;" />
    <input type="number" id="len" min="4" max="50" value="12" style="margin-top:8px;" />
    <label class="row"><input type="checkbox" id="upper" checked /> Uppercase (A-Z)</label>
    <label class="row"><input type="checkbox" id="lower" checked /> Lowercase (a-z)</label>
    <label class="row"><input type="checkbox" id="nums" checked /> Numbers (0-9)</label>
    <label class="row"><input type="checkbox" id="syms" checked /> Symbols (!@#$)</label>
    <label class="row"><input type="checkbox" id="noConfuse" checked /> Exclude confusing chars (0 O o l 1 I |)</label>
    <label class="row"><input type="checkbox" id="noRepeat" /> No repeated characters</label>
    <div class="btn-row">
      <button onclick="generate()">Generate</button>
      <button class="ghost" id="copyBtn" onclick="copyPass()">Copy</button>
    </div>
  </div>
</div>
<footer>&copy; 2025 TinyForge. All rights reserved.</footer>
<script>
  const lenNum = document.getElementById('len');
  const lenRange = document.getElementById('lenRange');
  lenRange.addEventListener('input', function() { lenNum.value = lenRange.value; generate(); });
  lenNum.addEventListener('input', function() { lenRange.value = lenNum.value; });
  ['upper','lower','nums','syms','noConfuse','noRepeat'].forEach(function(id) {
    document.getElementById(id).addEventListener('change', generate);
  });

  function buildSets() {
    let upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    let lower = 'abcdefghijklmnopqrstuvwxyz';
    let nums = '0123456789';
    let syms = '!@#$%^&*()_+-=[]{}|;:,.<>?';
    if (document.getElementById('noConfuse').checked) {
      upper = upper.replace(/[OI]/g, '');
      lower = lower.replace(/[ol]/g, '');
      nums = nums.replace(/[01]/g, '');
      syms = syms.replace(/[|]/g, '');
    }
    return { upper: upper, lower: lower, nums: nums, syms: syms };
  }

  function crackTime(entropy) {
    const guesses = Math.pow(2, entropy);
    const perSec = 1e10;
    const secs = guesses / perSec / 2;
    if (secs < 60) return 'to crack';
    if (secs < 3600) return Math.floor(secs / 60) + ' minutes to crack';
    if (secs < 86400) return Math.floor(secs / 3600) + ' hours to crack';
    if (secs < 31536000) return Math.floor(secs / 86400) + ' days to crack';
    if (secs < 31536000 * 100) return Math.floor(secs / 31536000) + ' years to crack';
    if (secs < 31536000 * 1e6) return Math.floor(secs / 31536000 / 100) / 10 + 'k years to crack';
    return 'millions of years to crack (practically safe)';
  }

  function generate() {
    let len = parseInt(document.getElementById('len').value, 10) || 12;
    if (len < 4) len = 4;
    if (len > 50) len = 50;
    document.getElementById('len').value = len;
    const sets = buildSets();
    let pools = [];
    if (document.getElementById('upper').checked && sets.upper) pools.push(sets.upper);
    if (document.getElementById('lower').checked && sets.lower) pools.push(sets.lower);
    if (document.getElementById('nums').checked && sets.nums) pools.push(sets.nums);
    if (document.getElementById('syms').checked && sets.syms) pools.push(sets.syms);
    if (!pools.length) { alert('Please select at least one option.'); return; }
    const noRepeat = document.getElementById('noRepeat').checked;
    const allChars = pools.join('');
    if (noRepeat && len > allChars.length) { alert('This length is not possible with no-repeat. Reduce length or enable more options.'); return; }
    let pass = '';
    const arr = new Uint32Array(len * 4);
    crypto.getRandomValues(arr);
    let ai = 0;
    function rand(n) { return arr[ai++ % arr.length] % n; }
    // Real world rule: har selected type ka kam se kam 1 char pakka
    pools.forEach(function(p) {
      let ch = p[rand(p.length)];
      if (noRepeat) { while (pass.includes(ch)) ch = p[rand(p.length)]; }
      pass += ch;
    });
    while (pass.length < len) {
      const ch = allChars[rand(allChars.length)];
      if (noRepeat && pass.includes(ch)) continue;
      pass += ch;
    }
    // Shuffle taaki pehle chars fix order me na rahe
    pass = pass.split('').sort(function() { return rand(2) ? 1 : -1; }).join('');
    document.getElementById('out').textContent = pass;
    const entropy = Math.round(len * Math.log2(allChars.length));
    let score = 0;
    if (len >= 8) score++;
    if (len >= 12) score++;
    if (pools.length >= 3) score++;
    if (pools.length === 4 && len >= 12) score++;
    const label = score <= 1 ? 'Weak' : score === 2 ? 'Good' : score === 3 ? 'Strong' : 'Very Strong';
    const bar = document.getElementById('bar').children;
    for (let i = 0; i < 4; i++) {
      bar[i].className = i < score ? 'on' + score : '';
    }
    document.getElementById('strength').innerHTML = 'Strength: <b>' + label + '</b>';
    document.getElementById('meta').innerHTML = 'Entropy: <b>' + entropy + ' bits</b> | ' + crackTime(entropy) + '<br>Tip: 14+ length with all 4 types is best for bank / email.';
    document.getElementById('copyBtn').textContent = 'Copy';
  }
  function copyPass() {
    const t = document.getElementById('out').textContent;
    if (!t || t === 'Click Generate') return;
    function done() {
      const b = document.getElementById('copyBtn');
      b.textContent = 'Copied!';
      setTimeout(function() { b.textContent = 'Copy'; }, 1500);
    }
    if (navigator.clipboard) {
      navigator.clipboard.writeText(t).then(done).catch(function() {
        fallback();
      });
    } else { fallback(); }
    function fallback() {
      const ta = document.createElement('textarea');
      ta.value = t;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch(e) {}
      ta.remove();
    }
  }
  generate();
</script>
</body>
</html>
